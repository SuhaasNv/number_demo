<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Memory Demo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%A0%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="periodic.css">
<link rel="stylesheet" href="countries.css">
</head>
<body>

  <!-- SCREEN 0: PIN gate — shown first, keeps casual visitors out -->
  <section id="pin-screen" class="screen active">
    <div class="ambient-bg"></div>
    <h1 class="title">Memory Demo</h1>
    <p class="subtitle">Enter PIN to continue</p>
    <form id="pin-form" class="pin-form" autocomplete="off">
      <input id="pin-input" class="pin-input" type="password" inputmode="numeric" maxlength="8" autocomplete="off" aria-label="PIN">
      <button type="submit" class="unlock-btn">Unlock</button>
    </form>
    <p id="pin-error" class="pin-error"></p>
  </section>

  <!-- SCREEN 1: launch screen — choose the activity -->
  <section id="launch-screen" class="screen">
    <div class="ambient-bg"></div>
    <h1 class="title">Memory Demo</h1>
    <p class="subtitle">Choose an activity</p>
    <div class="mode-choices">
      <button id="start-numbers-btn" class="mode-card" type="button">
        <span class="mode-glyph">123</span>
        <span class="mode-label">Numbers</span>
      </button>
      <button id="start-colors-btn" class="mode-card" type="button">
        <span class="mode-glyph mode-glyph-colors" aria-hidden="true"></span>
        <span class="mode-label">Colours</span>
      </button>
      <button id="start-periodic-btn" class="mode-card" type="button">
        <span class="mode-glyph">Pt</span>
        <span class="mode-label">Periodic Table</span>
      </button>
      <button id="start-countries-btn" class="mode-card" type="button">
        <span class="mode-glyph" aria-hidden="true">🌐</span>
        <span class="mode-label">Countries</span>
      </button>
    </div>
    <button id="logout-btn" class="logout-btn" type="button">Log Out</button>
  </section>

  <!-- SCREEN 1b: how many cells for Numbers / Colours -->
  <section id="size-screen" class="screen">
    <div class="ambient-bg"></div>
    <h1 class="title">How many?</h1>
    <p id="size-subtitle" class="subtitle">Choose 2 to 100 digits</p>
    <form id="size-form" class="pin-form" autocomplete="off" novalidate>
      <input id="size-input" class="pin-input size-input" type="text" inputmode="numeric" maxlength="3" value="100" autocomplete="off" aria-label="How many digits">
      <button type="submit" class="unlock-btn">Start</button>
    </form>
    <p id="size-error" class="pin-error"></p>
    <div id="history" class="history" hidden></div>
    <button id="size-back-btn" class="logout-btn" type="button">Back</button>
  </section>

  <!-- SCREEN 1c: type the digits in rows (Numbers only) -->
  <section id="line-screen" class="screen">
    <div class="ambient-bg"></div>
    <h1 class="title">Type the digits</h1>
    <p id="line-subtitle" class="subtitle">0 / 0 digits</p>
    <form id="line-form" class="pin-form line-form" autocomplete="off" novalidate>
      <div class="line-card">
        <textarea id="line-input" class="line-input" rows="1" wrap="off" inputmode="numeric" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Start typing the digits" aria-label="Digits"></textarea>
        <div class="line-bar"><i id="line-fill"></i></div>
      </div>
      <div class="line-actions">
        <button id="line-clear-btn" class="logout-btn" type="button">Clear All</button>
        <button type="submit" class="unlock-btn">Next</button>
      </div>
    </form>
    <p id="line-error" class="pin-error"></p>
    <button id="line-back-btn" class="logout-btn" type="button">Back</button>
  </section>

  <!-- SCREEN 2: one persistent full-screen grid — typing, then the reveal -->
  <section id="demo-screen" class="screen">
    <div class="ambient-bg"></div>

    <h1 id="demo-title" class="title demo-title">Memory Demo</h1>
    <div id="stage-label" class="stage-label"></div>
    <div id="thanks-name" class="thanks-name">Dr. Sireesha Swaroop</div>

    <div class="grid" id="demo-grid"></div>

    <div id="palette" class="palette"></div>

    <button id="clear-btn" class="clear-btn" type="button">Clear All</button>
    <div id="hint" class="hint"></div>
  </section>

  <!-- SCREEN 3: Periodic Table — fixed, known data, straight to the reveal -->
  <section id="periodic-screen" class="screen">
    <div class="ambient-bg"></div>

    <div id="periodic-stage-label" class="stage-label"></div>
    <div id="periodic-thanks-name" class="thanks-name">Dr. Sireesha Swaroop</div>

    <div class="pt-stack">
      <div class="pt-wrap" id="pt-wrap">
        <div class="pt-legend" id="pt-legend"></div>
        <div class="pt-table" id="pt-table"></div>
        <div class="pt-fblock" id="pt-fblock"></div>
      </div>

      <div class="periodic-grid" id="periodic-grid"></div>
    </div>

    <div id="periodic-hint" class="hint"></div>
  </section>

  <!-- SCREEN 4: Countries & Capitals — world-map opener, then a searchable list -->
  <section id="countries-screen" class="screen">
    <div class="ambient-bg"></div>

    <h1 class="title">Countries &amp; Capitals</h1>

    <div class="cc-stack">
      <div class="map-wrap" id="map-wrap">
        <div class="continent-map" id="continent-map"></div>
      </div>

      <div class="search-wrap" id="search-wrap">
        <div class="search-row">
          <input id="country-search" class="country-search" type="text" placeholder="Search a country or capital…" autocomplete="off">
          <span id="country-count" class="country-count"></span>
        </div>
        <div class="country-results" id="country-results"></div>
      </div>
    </div>

    <div id="countries-hint" class="hint"></div>
  </section>

  <script src="script.js"></script>
  <script src="data/elements.js"></script>
  <script src="periodic.js"></script>
  <script src="data/countries.js"></script>
  <script src="countries.js"></script>
</body>
</html>
